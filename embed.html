<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pemutar IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; flex-direction: column; height: 100vh; }
    video { flex: 1; width: 100%; object-fit: contain; }
    .info { color: #fff; padding: 0.5rem; font-size: 0.9rem; }
    .status { color: #aaa; padding: 0.5rem; text-align: center; }
  </style>
</head>
<body>
  <div class="status" id="status">Memuat...</div>
  <video id="player" controls allowfullscreen></video>
  <div class="info" id="chName"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get("url");
    const nama = params.get("nama") || "Saluran";
    document.getElementById("chName").textContent = nama;

    const video = document.getElementById("player");
    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play().catch(() => {});
        document.getElementById("status").remove();
      });
    } else {
      video.src = url;
      video.play().catch(() => {});
      document.getElementById("status").remove();
    }
  </script>
</body>
</html>
