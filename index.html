<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV Langsung — Tonton Saluran dari Seluruh Dunia</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.21/dist/hl.min.js"></script>
  <style>
    :root {
      --utama: #2563eb;
      --sukses: #10b981;
      --peringatan: #f59e0b;
      --bahaya: #ef4444;
      --latar-gelap: #0f172a;
      --kartu-gelap: #1e293b;
      --batas-gelap: #334155;
      --teks-gelap: #f1f5f9;
      --latar-terang: #f8fafc;
      --kartu-terang: #ffffff;
      --batas-terang: #e2e8f0;
      --teks-terang: #0f172a;
      --bayangan: 0 4px 20px rgba(0,0,0,.15);
      --radius: 12px;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      transition: background .3s, color .3s;
    }
    body.gelap {
      background: var(--latar-gelap);
      color: var(--teks-gelap);
      --kartu: var(--kartu-gelap);
      --batas: var(--batas-gelap);
      --teks: var(--teks-gelap);
    }
    body.terang {
      background: var(--latar-terang);
      color: var(--teks-terang);
      --kartu: var(--kartu-terang);
      --batas: var(--batas-terang);
      --teks: var(--teks-terang);
    }

    header {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(10px);
      background: rgba(15,23,42,.7);
      border-bottom: 1px solid var(--batas);
      padding: .8rem 1.2rem;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .8rem;
    }
    .judul { display: flex; align-items: center; gap: .6rem; }
    .judul h1 { font-size: 1.2rem; margin: 0; }
    .judul span { opacity: .6; font-size: .9rem; }
    .tombol-tema {
      background: var(--kartu); color: inherit; border: 1px solid var(--batas);
      padding: .5rem .8rem; border-radius: 8px; cursor: pointer;
    }

    .wadah { display: grid; grid-template-columns: 340px 1fr; gap: 1.2rem; padding: 1.2rem; max-width: 1600px; margin: 0 auto; }
    @media (max-width: 900px) { .wadah { grid-template-columns: 1fr; } }

    .panel-samping { display: flex; flex-direction: column; gap: .8rem; }
    .pencari { display: flex; flex-direction: column; gap: .6rem; }
    input, select {
      padding: .8rem 1rem; border: 1px solid var(--batas); border-radius: var(--radius);
      background: var(--kartu); color: inherit; font-size: .95rem;
    }

    .daftar-saluran {
      list-style: none; padding: 0; margin: 0;
      border: 1px solid var(--batas); border-radius: var(--radius);
      background: var(--kartu); overflow: hidden;
      max-height: 65vh; overflow-y: auto;
    }
    .daftar-saluran li {
      padding: .8rem 1rem; cursor: pointer; border-bottom: 1px solid var(--batas);
      transition: background .15s; display: flex; align-items: center; gap: .7rem;
    }
    .daftar-saluran li:last-child { border-bottom: none; }
    .daftar-saluran li:hover { background: rgba(37,99,235,.1); }
    .daftar-saluran li.terpilih { background: var(--utama); color: white; }
    .logo-saluran {
      width: 32px; height: 32px; border-radius: 6px; object-fit: cover; flex-shrink: 0;
      background: linear-gradient(135deg, #2563eb, #8b5cf6); display: flex; align-items: center; justify-content: center; font-weight: bold;
    }
    .info-nama { flex: 1; overflow: hidden; }
    .info-nama .nama { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .info-nama .meta { font-size: .75rem; opacity: .7; margin-top: .1rem; }

    .pemutar-wadah {
      background: #000; border-radius: var(--radius); overflow: hidden;
      aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    video { width: 100%; height: 100%; display: block; }
    .status-pemutar {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: white; text-align: center; padding: 1rem; background: rgba(0,0,0,.7); border-radius: var(--radius);
    }
    .memuat { display: inline-block; width: 24px; height: 24px; border: 3px solid #fff; border-top-color: transparent; border-radius: 50%; animation: putar .8s linear infinite; margin-bottom: .5rem; }
    @keyframes putar { to { transform: rotate(360deg); } }

    .info-saluran { margin: 1rem 0; display: flex; align-items: center; gap: 1rem; }
    .info-saluran .logo-besar { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; background: linear-gradient(135deg, #2563eb, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
    .info-teks h2 { margin: 0; font-size: 1.2rem; }
    .info-teks p { margin: .3rem 0 0; opacity: .7; font-size: .9rem; }

    .tombol-grup { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0; }
    .btn {
      padding: .7rem 1.1rem; border: none; border-radius: 8px; cursor: pointer; font-size: .9rem; font-weight: 500;
      display: inline-flex; align-items: center; gap: .4rem; transition: transform .15s, opacity .15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.utama { background: var(--utama); color: white; }
    .btn.hijau { background: var(--sukses); color: white; }
    .btn.ungu { background: #8b5cf6; color: white; }
    .btn.biru { background: #0ea5e9; color: white; }

    .kotak-kode {
      margin-top: 1rem; padding: 1rem; background: var(--kartu); border-radius: var(--radius);
      border: 1px solid var(--batas); display: none;
    }
    .kotak-kode.tampil { display: block; }
    textarea {
      width: 100%; min-height: 100px; margin: .5rem 0; padding: .8rem; border-radius: 6px;
      border: 1px solid var(--batas); background: rgba(0,0,0,.2); color: inherit;
      font-family: monospace; font-size: .85rem; resize: vertical;
    }
    .berbagi-tombol { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .5rem; }
    .berbagi-tombol a, .berbagi-tombol button {
      padding: .6rem 1rem; border-radius: 6px; text-decoration: none; border: none; cursor: pointer;
      font-size: .9rem;
    }
    .wa { background: #25d366; color: white; }
    .tg { background: #0088cc; color: white; }
    .fb { background: #1877f2; color: white; }
    .x { background: #000; color: white; }

    footer { text-align: center; padding: 1.5rem; border-top: 1px solid var(--batas); margin-top: 2rem; font-size: .85rem; opacity: .6; }
  </style>
</head>
<body class="gelap">
  <header>
    <div class="judul">
      <h1>📺 IPTV Langsung</h1>
      <span id="jumlahSaluran">Memuat...</span>
    </div>
    <button class="tombol-tema" id="tombolTema">☀️ Mode Terang</button>
  </header>

  <div class="wadah">
    <aside class="panel-samping">
      <div class="pencari">
        <input type="text" id="cari" placeholder="🔍 Cari nama saluran..." />
        <select id="pilihNegara">
          <option value="">Semua Negara</option>
        </select>
        <select id="pilihKategori">
          <option value="">Semua Kategori</option>
        </select>
      </div>
      <ul class="daftar-saluran" id="daftarSaluran">
        <li style="justify-content:center;opacity:.6">Memuat daftar saluran...</li>
      </ul>
    </aside>

    <main>
      <div class="pemutar-wadah">
        <div class="status-pemutar" id="statusPemutar">Pilih saluran untuk mulai menonton</div>
        <video id="pemutar" controls playsinline></video>
      </div>

      <div class="info-saluran" id="infoSaluran" style="display:none">
        <div class="logo-besar" id="logoBesar">—</div>
        <div class="info-teks">
          <h2 id="namaSaluran">—</h2>
          <p id="metaSaluran"></p>
        </div>
      </div>

      <div class="tombol-grup">
        <button class="btn utama" id="tombolFavorit">❤️ Simpan Favorit</button>
        <button class="btn hijau" id="tombolBagikan">📤 Bagikan</button>
        <button class="btn ungu" id="tombolSematkan">🧩 Sematkan</button>
        <button class="btn biru" id="tombolM3U">📋 Salin Tautan</button>
      </div>

      <div class="kotak-kode" id="kotakBagikan">
        <h3>Bagikan Saluran</h3>
        <div class="berbagi-tombol">
          <a id="linkWA" target="_blank" class="wa">WhatsApp</a>
          <a id="linkTG" target="_blank" class="tg">Telegram</a>
          <a id="linkFB" target="_blank" class="fb">Facebook</a>
          <a id="linkX" target="_blank" class="x">X / Twitter</a>
          <button id="tombolSalinTautan">Salin Tautan</button>
        </div>
      </div>

      <div class="kotak-kode" id="kotakSematkan">
        <h3>Kode Sematkan</h3>
        <label style="font-size:.85rem;opacity:.7">Lebar:</label>
        <input type="number" id="lebarIframe" value="100%" style="width:100px;padding:.4rem;margin:.3rem 0" />
        <label style="font-size:.85rem;opacity:.7">Tinggi:</label>
        <input type="number" id="tinggiIframe" value="450" style="width:80px;padding:.4rem;margin:.3rem 0" />
        <label style="margin-left:.5rem"><input type="checkbox" id="autoplayIframe"> Autoplay</label>
        <textarea id="kodeSematkan" readonly></textarea>
        <button class="btn utama" id="tombolSalinSematkan">Salin Kode</button>
      </div>
    </main>
  </div>

  <footer>
    <p>Sumber data: <a href="https://github.com/iptv-org/iptv" target="_blank" style="color:inherit">iptv-org</a> · Data disediakan apa adanya</p>
  </footer>

  <script>
    // Pemetaan kode negara → nama lengkap
    const PETA_NEGARA = {
      'AF': 'Afganistan', 'AL': 'Albania', 'DZ': 'Aljazair', 'AS': 'Samoa Amerika', 'AD': 'Andorra', 'AO': 'Angola',
      'AR': 'Argentina', 'AM': 'Armenia', 'AW': 'Aruba', 'AU': 'Australia', 'AT': 'Austria', 'AZ': 'Azerbaijan',
      'BS': 'Bahama', 'BH': 'Bahrain', 'BD': 'Bangladesh', 'BB': 'Barbados', 'BY': 'Belarus', 'BE': 'Belgia',
      'BZ': 'Belize', 'BJ': 'Benin', 'BT': 'Bhutan', 'BO': 'Bolivia', 'BA': 'Bosnia-Herzegovina', 'BW': 'Botswana',
      'BR': 'Brasil', 'BN': 'Brunei', 'BG': 'Bulgaria', 'BF': 'Burkina Faso', 'BI': 'Burundi', 'KH': 'Kamboja',
      'CM': 'Kamerun', 'CA': 'Kanada', 'CV': 'Tanjung Verde', 'CF': 'Afrika Tengah', 'TD': 'Chad', 'CL': 'Cili',
      'CN': 'Tiongkok', 'CO': 'Kolombia', 'KM': 'Komoro', 'CG': 'Kongo', 'CD': 'Kongo DR', 'CR': 'Kosta Rika',
      'CI': 'Pantai Gading', 'HR': 'Kroasia', 'CU': 'Kuba', 'CY': 'Siprus', 'CZ': 'Ceko', 'DK': 'Denmark',
      'DJ': 'Jibuti', 'DM': 'Dominika', 'DO': 'Republik Dominika', 'EC': 'Ekuador', 'EG': 'Mesir', 'SV': 'El Salvador',
      'GQ': 'Guinea Khatulistiwa', 'ER': 'Eritrea', 'EE': 'Estonia', 'ET': 'Etiopia', 'FJ': 'Fiji', 'FI': 'Finlandia',
      'FR': 'Prancis', 'GA': 'Gabon', 'GM': 'Gambia', 'GE': 'Georgia', 'DE': 'Jerman', 'GH': 'Ghana', 'GR': 'Yunani',
      'GT': 'Guatemala', 'GN': 'Guinea', 'GY': 'Guyana', 'HT': 'Haiti', 'HN': 'Honduras', 'HK': 'Hong Kong',
      'HU': 'Hungaria', 'IS': 'Islandia', 'IN': 'India', 'ID': 'Indonesia', 'IR': 'Iran', 'IQ': 'Irak',
      'IE': 'Irlandia', 'IL': 'Israel', 'IT': 'Italia', 'JM': 'Jamaika', 'JP': 'Jepang', 'JO': 'Yordania',
      'KZ': 'Kazakstan', 'KE': 'Kenya', 'KW': 'Kuwait', 'KG': 'Kirgistan', 'LA': 'Laos', 'LV': 'Latvia',
      'LB': 'Libanon', 'LR': 'Liberia', 'LY': 'Libya', 'LT': 'Lituania', 'LU': 'Luksemburg', 'MO': 'Makau',
      'MY': 'Malaysia', 'MV': 'Maladewa', 'ML': 'Mali', 'MT': 'Malta', 'MR': 'Mauritania', 'MU': 'Maurisius',
      'MX': 'Meksiko', 'MD': 'Moldova', 'MN': 'Mongolia', 'MA': 'Maroko', 'MZ': 'Mozambik', 'MM': 'Myanmar',
      'NA': 'Namibia', 'NP': 'Nepal', 'NL': 'Belanda', 'NZ': 'Selandia Baru', 'NI': 'Nikaragua', 'NG': 'Nigeria',
      'KP': 'Korea Utara', 'NO': 'Norwegia', 'OM': 'Oman', 'PK': 'Pakistan', 'PA': 'Panama', 'PG': 'Papua Nugini',
      'PY': 'Paraguay', 'PE': 'Peru', 'PH': 'Filipina', 'PL': 'Polandia', 'PT': 'Portugis', 'QA': 'Qatar',
      'RO': 'Rumania', 'RU': 'Rusia', 'RW': 'Rwanda', 'SA': 'Arab Saudi', 'SN': 'Senegal', 'RS': 'Serbia',
      'SG': 'Singapura', 'SK': 'Slowakia', 'SI': 'Slovenia', 'SO': 'Somalia', 'ZA': 'Afrika Selatan', 'KR': 'Korea Selatan',
      'ES': 'Spanyol', 'LK': 'Sri Lanka', 'SD': 'Sudan', 'SE': 'Swedia', 'CH': 'Swiss', 'SY': 'Suriah',
      'TW': 'Taiwan', 'TJ': 'Tajikistan', 'TZ': 'Tanzania', 'TH': 'Thailand', 'TN': 'Tunisia', 'TR': 'Turki',
      'TM': 'Turkmenistan', 'UG': 'Uganda', 'UA': 'Ukraina', 'AE': 'Uni Emirat Arab', 'GB': 'Inggris Raya',
      'US': 'Amerika Serikat', 'UY': 'Uruguay', 'UZ': 'Uzbekistan', 'VE': 'Venezuela', 'VN': 'Vietnam',
      'YE': 'Yaman', 'ZM': 'Zambia', 'ZW': 'Zimbabwe', 'EU': 'Eropa', 'INT': 'Internasional'
    };

    const DAFTAR_KATEGORI = ['Berita','Olahraga','Hiburan','Anak-anak','Film','Musik','Pendidikan','Agama','Umum','Bisnis','Perjalanan','Makanan','Lainnya'];

    const URL_M3U = 'https://iptv-org.github.io/iptv/index.m3u';
    let daftarSaluran = [];
    let saluranAktif = null;
    let pemutarHls = null;
    let daftarFavorit = JSON.parse(localStorage.getItem('favorit') || '[]');

    // Hash aman untuk semua karakter
    function buatId(teks) {
      let h = 5381;
      for (let i = 0; i < teks.length; i++) {
        h = ((h << 5) + h) ^ teks.charCodeAt(i);
      }
      return (h >>> 0).toString(36);
    }

    // Ambil kode negara dari tvg-id (contoh: channel.id → id)
    function ambilKodeNegaraDariId(tvgId) {
      if (!tvgId) return '';
      const bagian = tvgId.trim().split('.');
      if (bagian.length > 1) {
        const kode = bagian.pop().toUpperCase();
        if (PETA_NEGARA[kode]) return kode;
      }
      const cocok = tvgId.match(/\.([a-z]{2})$/i);
      return cocok ? cocok[1].toUpperCase() : '';
    }

    // Urai M3U
    function uraiM3U(teks) {
      const baris = teks.split('\n');
      const hasil = [];
      let info = {};

      for (const b of baris) {
        if (b.startsWith('#EXTINF')) {
          const koma = b.indexOf(',');
          const nama = koma > -1 ? b.slice(koma + 1).trim() : 'Tanpa Nama';
          const tvgId = b.match(/tvg-id="([^"]*)"/)?.[1] || '';
          const logo = b.match(/tvg-logo="([^"]*)"/)?.[1] || '';
          const grup = b.match(/group-title="([^"]*)"/)?.[1] || 'Umum';
          let kodeNegara = b.match(/country="([^"]*)"/)?.[1] || '';
          if (!kodeNegara) kodeNegara = ambilKodeNegaraDariId(tvgId);

          info = { nama, tvgId, logo, grup, kodeNegara };
        } else if (b.startsWith('http') && !b.startsWith('#')) {
          hasil.push({
            id: buatId(info.nama + b),
            nama: info.nama,
            url: b.trim(),
            logo: info.logo,
            kategori: info.grup,
            kodeNegara: (info.kodeNegara || 'INT').toUpperCase()
          });
          info = {};
        }
      }
      return hasil;
    }

    // Muat & tampilkan daftar
    async function muatDaftar() {
      try {
        const res = await fetch(URL_M3U);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const teks = await res.text();
        daftarSaluran = uraiM3U(teks);

        // Isi dropdown negara
        const negaraUnik = [...new Set(daftarSaluran.map(s => s.kodeNegara))].sort();
        const elNegara = document.getElementById('pilihNegara');
        negaraUnik.forEach(kode => {
          const nama = PETA_NEGARA[kode] || kode;
          elNegara.innerHTML += `<option value="${kode}">${kode} — ${nama}</option>`;
        });

        // Isi dropdown kategori
        const katUnik = [...new Set(daftarSaluran.map(s => s.kategori))].sort();
        const elKat = document.getElementById('pilihKategori');
        katUnik.forEach(k => {
          elKat.innerHTML += `<option value="${k}">${k}</option>`;
        });

        document.getElementById('jumlahSaluran').textContent = `${daftarSaluran.length} saluran`;
        terapkanPenyaring();
      } catch (err) {
        document.getElementById('daftarSaluran').innerHTML =
          `<li style="color:var(--bahaya);justify-content:center">Gagal memuat: ${err.message}</li>`;
      }
    }

    function dapatInisial(nama) {
      return nama.trim().slice(0, 2).toUpperCase() || 'TV';
    }

    function buatItemSaluran(s) {
      const adaFav = daftarFavorit.includes(s.id);
      return `
        <li data-id="${s.id}" data-url="${s.url}" data-nama="${s.nama}" data-logo="${s.logo}" data-kategori="${s.kategori}" data-negara="${s.kodeNegara}">
          <div class="logo-saluran">
            ${s.logo
              ? `<img src="${s.logo}" alt="${s.nama}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />`
              : ''}
            <span style="display:${s.logo?'none':'flex'}">${dapatInisial(s.nama)}</span>
          </div>
          <div class="info-nama">
            <div class="nama">${s.nama}</div>
            <div class="meta">${s.kodeNegara} · ${s.kategori}</div>
          </div>
          ${adaFav ? '<span style="color:#f59e0b">❤️</span>' : ''}
        </li>`;
    }

    function terapkanPenyaring() {
      const kata = document.getElementById('cari').value.toLowerCase().trim();
      const neg = document.getElementById('pilihNegara').value;
      const kat = document.getElementById('pilihKategori').value;

      const tersaring = daftarSaluran.filter(s =>
        (!kata || s.nama.toLowerCase().includes(kata)) &&
        (!neg || s.kodeNegara === neg) &&
        (!kat || s.kategori === kat)
      );

      const el = document.getElementById('daftarSaluran');
      el.innerHTML = tersaring.length
        ? tersaring.map(buatItemSaluran).join('')
        : '<li style="justify-content:center;opacity:.6">Tidak ditemukan</li>';

      el.querySelectorAll('li').forEach(li => {
        li.addEventListener('click', () => pilihSaluran(li.dataset));
      });
    }

    // Ganti saluran — FUNGSI DIPERBAIKI
    function pilihSaluran(data) {
      // Hapus tanda terpilih lama
      document.querySelectorAll('.daftar-saluran li').forEach(l => l.classList.remove('terpilih'));
      event.target.closest('li').classList.add('terpilih');

      // Simpan saluran aktif
      saluranAktif = data;

      // === PERBAIKAN: Perbarui SEMUA bagian tampilan ===
      document.getElementById('namaSaluran').textContent = data.nama;
      document.getElementById('metaSaluran').textContent =
        `${data.negara ? (PETA_NEGARA[data.negara] || data.negara) : ''} · ${data.kategori || 'Umum'}`;

      // Logo besar
      const logoBesar = document.getElementById('logoBesar');
      if (data.logo) {
        logoBesar.innerHTML = `<img src="${data.logo}" alt="${data.nama}" style="width:100%;height:100%;object-fit:contain" onerror="this.parentElement.innerHTML='${dapatInisial(data.nama)}'" />`;
      } else {
        logoBesar.innerHTML = dapatInisial(data.nama);
      }

      // Tampilkan info saluran
      document.getElementById('infoSaluran').style.display = 'flex';

      // Perbarui tombol favorit
      perbaruiTombolFavorit();

      // Sembunyikan kotak kode saat ganti saluran
      document.getElementById('kotakBagikan').classList.remove('tampil');
      document.getElementById('kotakSematkan').classList.remove('tampil');

      // Mulai putar saluran baru
      putarSaluran(data.url);

      // Perbarui tautan berbagi & kode sematkan
      perbaruiTautanBerbagi();
      perbaruiKodeSematkan();
    }

    // Pemutar — DIOPTIMALKAN
    function putarSaluran(url) {
      const video = document.getElementById('pemutar');
      const status = document.getElementById('statusPemutar');

      // Hentikan & hapus pemutar lama SEPENUHNYA
      if (pemutarHls) {
        pemutarHls.stopLoad();
        pemutarHls.detachMedia();
        pemutarHls.destroy();
        pemutarHls = null;
      }
      video.pause();
      video.removeAttribute('src');
      video.load(); // Reset pemutar

      // Tampilkan status memuat
      status.innerHTML = '<div class="memuat"></div><br>Memuat aliran...';
      status.style.display = 'block';

      if (Hls.isSupported()) {
        pemutarHls = new Hls({
          maxBufferLength: 10,
          maxMaxBufferLength: 20,
          manifestLoadingMaxRetry: 5,
          levelLoadingMaxRetry: 5
        });

        pemutarHls.loadSource(url);
        pemutarHls.attachMedia(video);

        pemutarHls.on(Hls.Events.MANIFEST_PARSED, () => {
          status.style.display = 'none';
          video.play().catch(() => {
            status.innerHTML = 'Klik untuk mulai menonton';
            status.style.display = 'block';
            status.onclick = () => {
              video.play();
              status.style.display = 'none';
              status.onclick = null;
            };
          });
        });

        pemutarHls.on(Hls.Events.ERROR, (e, data) => {
          if (data.fatal) {
            status.innerHTML = '⚠️ Aliran tidak dapat diputar<br>Silakan coba saluran lain';
            status.style.display = 'block';
            if (pemutarHls) pemutarHls.destroy();
            pemutarHls = null;
          }
        });
      }
      // Safari asli mendukung HLS
      else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.addEventListener('loadedmetadata', () => {
          status.style.display = 'none';
          video.play().catch(() => {});
        });
        video.addEventListener('error', () => {
          status.innerHTML = '⚠️ Aliran tidak dapat diputar';
          status.style.display = 'block';
        });
      }
      else {
        status.innerHTML = '⚠️ Peramban Anda tidak mendukung pemutar video';
      }
    }

    // Favorit
    function perbaruiTombolFavorit() {
      const btn = document.getElementById('tombolFavorit');
      if (!saluranAktif) return;
      const ada = daftarFavorit.includes(saluranAktif.id);
      btn.textContent = ada ? '❤️ Sudah Favorit' : '🤍 Simpan Favorit';
      btn.onclick = () => {
        const idx = daftarFavorit.indexOf(saluranAktif.id);
        if (idx > -1) daftarFavorit.splice(idx, 1);
        else daftarFavorit.push(saluranAktif.id);
        localStorage.setItem('favorit', JSON.stringify(daftarFavorit));
        perbaruiTombolFavorit();
        terapkanPenyaring();
      };
    }

    // Tautan berbagi
    function dapatTautanSaluran() {
      if (!saluranAktif) return '';
      const asal = window.location.origin + window.location.pathname;
      const param = new URLSearchParams({
        ch: saluranAktif.nama,
        url: saluranAktif.url,
        logo: saluranAktif.logo || ''
      });
      return `${asal}?${param.toString()}`;
    }

    function perbaruiTautanBerbagi() {
      const tautan = dapatTautanSaluran();
      if (!tautan) return;
      const pesan = `Tonton ${saluranAktif.nama} lewat IPTV:\n${tautan}`;
      document.getElementById('linkWA').href = `https://wa.me/?text=${encodeURIComponent(pesan)}`;
      document.getElementById('linkTG').href = `https://t.me/share/url?url=${encodeURIComponent(tautan)}&text=${encodeURIComponent('Tonton saluran ini!')}`;
      document.getElementById('linkFB').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(tautan)}`;
      document.getElementById('linkX').href = `https://twitter.com/intent/tweet?url=${encodeURIComponent(tautan)}&text=${encodeURIComponent('Tonton saluran ini!')}`;
    }

    function perbaruiKodeSematkan() {
      if (!saluranAktif) return;
      const lebar = document.getElementById('lebarIframe').value || '100%';
      const tinggi = document.getElementById('tinggiIframe').value || '450';
      const autoplay = document.getElementById('autoplayIframe').checked;
      const param = new URLSearchParams({
        embed: '1',
        url: saluranAktif.url,
        nama: saluranAktif.nama
      });
      if (autoplay) param.set('autoplay', '1');
      const asal = window.location.origin + window.location.pathname;
      const src = `${asal}?${param.toString()}`;
      document.getElementById('kodeSematkan').value =
`<iframe src="${src}" width="${lebar}" height="${tinggi}" frameborder="0" allowfullscreen allow="autoplay; fullscreen"></iframe>`;
    }

    // Tema
    function pasangTema() {
      const temaSimpan = localStorage.getItem('tema');
      if (temaSimpan === 'terang') {
        document.body.classList.remove('gelap');
        document.body.classList.add('terang');
        document.getElementById('tombolTema').textContent = '🌙 Mode Gelap';
      }
      document.getElementById('tombolTema').onclick = () => {
        const ganti = document.body.classList.contains('gelap');
        document.body.classList.toggle('gelap', !ganti);
        document.body.classList.toggle('terang', ganti);
        localStorage.setItem('tema', ganti ? 'terang' : 'gelap');
        document.getElementById('tombolTema').textContent = ganti ? '🌙 Mode Gelap' : '☀️ Mode Terang';
      };
    }

    // Baca parameter embed / bagikan
    function bacaParameterMuat() {
      const p = new URLSearchParams(window.location.search);
      if (p.get('embed') === '1') {
        // Mode sematkan — tampilkan pemutar penuh
        document.querySelector('.panel-samping').style.display = 'none';
        document.querySelector('.wadah').gridTemplateColumns = '1fr';
        const url = p.get('url');
        const nama = p.get('nama') || 'Saluran';
        if (url) {
          saluranAktif = { url, nama };
          document.getElementById('namaSaluran').textContent = nama;
          document.getElementById('infoSaluran').style.display = 'flex';
          if (p.get('autoplay') === '1') putarSaluran(url);
          else {
            document.getElementById('statusPemutar').innerHTML = 'Klik untuk menonton';
            document.getElementById('statusPemutar').style.display = 'block';
            document.getElementById('statusPemutar').onclick = () => {
              putarSaluran(url);
              document.getElementById('statusPemutar').onclick = null;
            };
          }
        }
        // Sembunyikan elemen tidak perlu di embed
        document.querySelector('.tombol-grup').style.display = 'none';
        document.querySelector('footer').style.display = 'none';
        document.querySelector('header').style.display = 'none';
        return true;
      }
      if (p.get('url')) {
        // Tautan berbagi — langsung putar
        pilihSaluran({
          url: p.get('url'),
          nama: p.get('ch') || 'Saluran',
          logo: p.get('logo') || '',
          negara: '',
          kategori: ''
        });
        return true;
      }
      return false;
    }

    // Inisialisasi
    document.addEventListener('DOMContentLoaded', () => {
      pasangTema();

      // Pasang penyaring
      const cari = () => terapkanPenyaring();
      document.getElementById('cari').addEventListener('input', cari);
      document.getElementById('pilihNegara').addEventListener('change', cari);
      document.getElementById('pilihKategori').addEventListener('change', cari);

      // Tombol berbagi/sematkan
      document.getElementById('tombolBagikan').onclick = () => {
        document.getElementById('kotakBagikan').classList.toggle('tampil');
        document.getElementById('kotakSematkan').classList.remove('tampil');
      };
      document.getElementById('tombolSematkan').onclick = () => {
        document.getElementById('kotakSematkan').classList.toggle('tampil');
        document.getElementById('kotakBagikan').classList.remove('tampil');
        perbaruiKodeSematkan();
      };
      document.getElementById('tombolM3U').onclick = () => {
        if (!saluranAktif) return alert('Pilih saluran dulu');
        navigator.clipboard.writeText(saluranAktif.url).then(() => alert('Tautan M3U disalin!'));
      };
      document.getElementById('tombolSalinTautan').onclick = () => {
        navigator.clipboard.writeText(dapatTautanSaluran()).then(() => alert('Tautan disalin!'));
      };
      document.getElementById('tombolSalinSematkan').onclick = {
        handleEvent: function() {
          navigator.clipboard.writeText(document.getElementById('kodeSematkan').value).then(() => alert('Kode disalin!'));
        }
      };
      ['lebarIframe','tinggiIframe','autoplayIframe'].forEach(id => {
        document.getElementById(id).addEventListener('change', perbaruiKodeSematkan);
      });

      // Baca parameter URL atau muat daftar
      const adaParam = bacaParameterMuat();
      if (!adaParam) muatDaftar();
    });
  </script>
</body>
</html>
